url: https://r-naxp.logmu.org/
authors:
  Tim Gordon:
    href: https://timgord.com
template:
  bootstrap: 5
  light-switch: yes
  bslib:
    base_font: Lisnoti
    # naxp.org's colours, from its naxp.css.
    # Text is teal.
    # The brand magenta (#FF00AA) is only ever an outline or a
    # mark, never a fill, so it stays in the logo but out of Bootstrap's
    # primary and secondary, which fill buttons and the active menu item.
    primary: '#00707A'
    secondary: '#054F57'
    body-color: '#181818'
    headings-color: '#054F57'
    link-color: '#00707A'
    link-hover-color: '#007D88'
    border-color: '#D5E4E5'
    navbar-light-bg: '#E8F4F5'
    # naxp.org's dark mode.
    body-bg-dark: '#0A1719'
    body-color-dark: '#EBEBEB'
    headings-color-dark: '#64CEC3'
    link-color-dark: '#4DD5C8'
    link-hover-color-dark: '#8FE5DC'
    border-color-dark: '#28474B'
    navbar-dark-bg: '#162E31'
  includes:
    # Web pages set Latin text in Lisnoti Regular,
    # so fetch it alongside the stylesheets.
    # pkgdown inserts this verbatim, so the path is from the root.
    in_header: |
      <link rel="preload" href="/fonts/Lisnoti-woff2/Lisnoti-Regular-latin.woff2" as="font" type="font/woff2" crossorigin>
footer:
  structure:
    left: [developed_by, typeset_in]
    right: built_with
  components:
    typeset_in: '<br>Typeset in <a href="https://lisnoti.com/">Lisnoti</a>.'
navbar:
  type: default
  left:
  - icon: fa-home
    href: index.html
    aria-label: Home
  - text: Get started
    href: articles/naxp.html
  - text: R index
    href: reference/index.html
  - text: naxp.org
    href: https://naxp.org/
  - text: Specification
    href: https://naxp.org/spec/
  - text: Change log
    href: news/index.html
reference:
- title: Standard naxps
  contents:
  - naxp_standard
- title: Parse a naxp
  contents:
  - naxp_parse
  - naxp_properties
- title: Encode and decode text
  contents:
  - naxp_encode
  - naxp_accepts
- title: Encoded vectors
  contents:
  - naxp_encoded
- title: Compare and emit naxps
  contents:
  - naxp_compare
  - naxp_emit
